# Note that it is recommended to utilize .config/docker-compose-base.yaml,
#   but we choose not to because we want to do things in a more custom way.
services:
  grafana:
    container_name: 'grafana-dev-wildgraphql'
    platform: 'linux/amd64'
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-11.6.14}
        development: ${DEVELOPMENT:-true}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # Grafana 13 chega a 1024M durante o e2e; com 1G o container caía no CI (ERR_CONNECTION_REFUSED).
          memory: 2048M
        reservations:
          cpus: "0.75"
          memory: 256M
    volumes:
      - ./provisioned-dashboards:/provisioned-dashboards:ro
    environment:
      GF_LOG_LEVEL: info
      # Grafana 13 instala em background vários apps do catálogo (pyroscope, advisor, drilldown...) ao subir,
      # o que deixa o e2e lento/instável no CI. O plugin não depende deles.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
  graphql-echo:
    container_name: 'grafana-dev-wildgraphql-graphql-echo'
#   image: 'ghcr.io/retrodaredevil/graphql-echo:0.1'
    image: 'ghcr.io/retrodaredevil/graphql-echo:sha-b1c6835'
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.75"
          memory: 256M
