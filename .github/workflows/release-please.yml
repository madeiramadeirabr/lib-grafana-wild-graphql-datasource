# Versionamento do fork: X.Y.Z-sp.N (versioning "service-pack" do release-please), onde X.Y.Z é a versão
# do upstream (wildmountainfarms/wild-graphql-datasource) e sp.N conta as releases da MadeiraMadeira sobre ela.
#   - Qualquer release nossa sobe só o N, seja qual for o tipo de commit: 1.7.2-sp.1 -> 1.7.2-sp.2
#   - Ao sincronizar com uma versão nova do upstream, use no commit o rodapé "Release-As: 1.8.0-sp.1"
#
# O build do zip roda aqui mesmo: releases criadas com o GITHUB_TOKEN não disparam outros workflows.
name: Release Please

on:
  push:
    branches:
      - main
  # Reconstrói e anexa o zip a uma release já existente (ex.: o build falhou depois da release ser criada).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.7.2-sp.1)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: codebuild-madeiramadeira-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-plugin:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    # Runner maior: o build do frontend (webpack) é pesado.
    runs-on:
      - codebuild-madeiramadeira-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Mesmos passos do job "Build, lint and unit tests" do ci.yml, que passa neste runner.
      # (grafana/plugin-actions/package-plugin morria sem mensagem logo após o webpack.)
      # Sem assinatura: o ID madeiramadeira-* não é assinado pela Grafana, e o Grafana
      # precisa dele em allow_loading_unsigned_plugins.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build backend
        uses: magefile/mage-action@v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Empacota o plugin (zip + sha1)
        id: package
        run: |
          id=$(node -p "require('./dist/plugin.json').id")
          version=$(node -p "require('./dist/plugin.json').info.version")
          if [ "v${version}" != "${TAG}" ]; then echo "Versão do plugin (v${version}) difere da tag (${TAG})"; exit 1; fi
          archive="${id}-${version}.zip"
          mv dist "${id}"
          zip -qr "${archive}" "${id}"
          sha1sum "${archive}" | cut -f1 -d' ' > "${archive}.sha1"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Anexa o zip e o sha1 à release
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha1" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
